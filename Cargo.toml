[package]
name = "chrusty"
version = "0.1.0"
edition = "2024"

[dependencies]
arrayvec = "0.7.7"
rand = "0.10.2"
rustyline = "18.0.1"
sfbinpack = "0.6.5"

[target.'cfg(target_arch = "x86_64")'.dependencies]
cozy-chess = { version = "0.3.4", features = ["pext"] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
cozy-chess = { version = "0.3.4" }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.release-perf]
inherits = "release"
# enable debug symbols for perf
debug = true
